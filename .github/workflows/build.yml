name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build single-file exe
        run: pyinstaller --noconfirm GoldPriceTray.spec

      - name: Rename to installer name
        run: |
          cd dist
          mv GoldPriceTray.exe GoldPriceTray_Setup.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: GoldPriceTray_Setup
          path: dist/GoldPriceTray_Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoldPriceTray_Setup.exe
          generate_release_notes: true
          name: ${{ github.ref_name }} · Windows 一键安装包
